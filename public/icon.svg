<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="vw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141534" />
      <stop offset="100%" stop-color="#0A0B1A" />
    </linearGradient>
    <linearGradient id="lime-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2EC58" />
      <stop offset="100%" stop-color="#C5CD43" />
    </linearGradient>
  </defs>

  <!-- Squircle rounded background -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#vw-bg)" />
  
  <!-- Subtle inner border highlight in Lime -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="none" stroke="#D5DD54" stroke-width="2.5" stroke-opacity="0.35" />

  <!-- Monogram VW in bold geometric strokes -->
  <!-- V in Pure White -->
  <path
    d="M 21 41 L 43 87 L 62 41"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- W in Acid Lime -->
  <path
    d="M 60 41 L 72 87 L 84 53 L 96 87 L 108 41"
    fill="none"
    stroke="url(#lime-accent)"
    stroke-width="10.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
